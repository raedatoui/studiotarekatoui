runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 20
  cpu: 1
  memoryMiB: 1024

env:
  - variable: WEBSITE_PREVIEW_URL
    value: ${CMS_WEBSITE_PREVIEW_URL}
    availability:
      - BUILD
      - RUNTIME
  - variable: AUTH_URL
    value: ${CMS_AUTH_URL}
  - variable: AUTH_TRUST_HOST
    value: 'true'
  - variable: DATABASE_URL
    secret: ${CMS_DATABASE_URL_REF}
    availability:
      - RUNTIME
  - variable: PAYLOAD_SECRET
    secret: ${CMS_PAYLOAD_SECRET_REF}
  - variable: AUTH_SECRET
    secret: ${CMS_AUTH_SECRET_REF}
    availability:
      - RUNTIME
  - variable: AUTH_GOOGLE_ID
    secret: ${CMS_AUTH_GOOGLE_ID_REF}
    availability:
      - RUNTIME
  - variable: AUTH_GOOGLE_SECRET
    secret: ${CMS_AUTH_GOOGLE_SECRET_REF}
    availability:
      - RUNTIME
  - variable: CMS_ALLOWED_EMAILS
    secret: ${CMS_ALLOWED_EMAILS_REF}
    availability:
      - RUNTIME
  - variable: MEDIA_BUCKET
    value: ${CMS_MEDIA_BUCKET}
    availability:
      - RUNTIME
  - variable: MEDIA_PREFIX
    value: ${CMS_MEDIA_PREFIX}
    availability:
      - RUNTIME
  - variable: MEDIA_BASE_URL
    value: ${CMS_MEDIA_BASE_URL}
    availability:
      - RUNTIME
