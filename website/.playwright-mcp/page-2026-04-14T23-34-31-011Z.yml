      - generic [ref=e162]:
        - heading "Waters' Witness" [level=2] [ref=e163]
        - paragraph [ref=e164]: 2020 —
        - generic [ref=e165]:
          - paragraph [ref=e166]: Waters' Witness is based on the ongoing project I/E Tarek Atoui initiated in 2015. Drawing upon research made in collaboration with the musicians and composers Chris Watson and Eric La Casa, Tarek Atoui uses sound recordings to document the human, ecological, historical and industrial realities of coastal cities that have a past rooted in their docklands, such as Athens, Abu Dhabi, Singapore, Beirut and Porto. Working in close proximity to or under the water, Atoui uses various recording techniques to capture the sounds of the sea and docks, and materials such as metal, stone and wood.
          - paragraph [ref=e167]: The first iteration of Waters' Witness took place at the Fridericianum in Kassel in 2020, followed by a new version in the Serralves Museum of Contemporary Art in 2022. Then, Waters' Witness was presented in 2022 at the Mudam Luxembourg and in 2023 at the MCA Sydney.
