        - heading "The Wind Harvesters" [level=2] [ref=e42]
        - paragraph [ref=e43]: "2023"
        - generic [ref=e44]:
          - paragraph [ref=e45]: "The Wind Harvesters #1 is an air circuit inspired by the water irrigation systems of rice fields in the area of Chiang Rai. It is made out of bamboo sections into which traditional wind instruments from the Akha and Lisu tribes were mounted and tuned by Atoui, the musicians and the instrument makers from these communities."
          - paragraph [ref=e46]: A computer-based composition translates the sound of the traditional wind instruments into water and hidden sound flows creating an intricate composition and listening situation for the audience visiting the work. The artist also conceived the space of this composition and its elements as a hospitality and performance ground for the members of these tribes and other musicians during the time of the exhibition.
