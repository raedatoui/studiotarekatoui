    - generic [ref=e208]:
      - generic [ref=e209]:
        - heading "The Wave" [level=2] [ref=e210]
        - paragraph [ref=e211]: "2019"
        - generic [ref=e212]:
          - paragraph [ref=e213]: The Wave is a composition deriving from experimentation that Tarek Atoui has been doing with the instruments and sounds constituting the piece. The instruments were developed for WITHIN, The Reverse Collection and The Ground, Atoui’s previous projects. The sounds are field recordings from I/E, Atoui’s project on harbour cities (Abu Dhabi, Athens and Singapore). Since their creation, these sound libraries and instruments have been activated by a variety of collaborators and musicians. Some were deaf, interacting with sound and performance for the first time; others were professional musicians familiar with improvisation and extended techniques. The Wave is inspired by these individual and collective encounters.
          - paragraph [ref=e214]: Instruments are animated by objects and sound, and sounds are broadcast through metal and stone. The listening space that is created is a delicate ever-changing microcosm that repeatedly gets washed away by the Horns of Putin and then builds up again.
