      - generic [ref=e117]:
        - heading "The Whisperers" [level=2] [ref=e118]
        - paragraph [ref=e119]: 2021 —
        - generic [ref=e120]:
          - paragraph [ref=e121]: The Whisperers conceived by Tarek Atoui is a series of listening devices composed of different materials that conduct and amplify sound in multi-sensory ways. These assemblages bring together plastic, wood, brass, water, bronze, glass and stone, experimenting with each material acoustic properties and the unique ways they transmit and reflect sound. Through The Whisperers, Atoui invites the visitor to plug-in their own music and experience it in fresh and innovative ways, they offer a medium for discovery and unpredictable, undoing the familiar and known.
          - paragraph [ref=e122]: Tarek Atoui has created a new series of The Whisperers in 2021 influenced and inspired by five workshop sessions that took place between November 2020 and June 2021 in a kindergarten classroom, l'École alsacienne in Paris, with 5-year-old students.
