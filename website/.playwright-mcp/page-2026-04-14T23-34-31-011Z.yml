    - generic [ref=e266]:
      - generic [ref=e267]:
        - heading "WITHIN" [level=2] [ref=e268]
        - paragraph [ref=e269]: 2016–2017 —
        - generic [ref=e270]:
          - paragraph [ref=e271]: WITHIN investigates how deafness can influence the way we understand sound, sound performance and concert situations. Reflecting a deaf person’s perspective, WITHIN also questions the act of listening and the way we build instruments, conduct, improvise, write scores and relate to an audience. Initiated in 2013 with Sharjah Art Foundation and Al Amal School for the Deaf, and enriched by the contribution of the curatorial duo Council (Sandra Terdjman and Gregory Castera), WITHIN further evolved at the Experimental Music and Performing Art Center, Rensselaer, US (2015); Berkeley Art Museum, US (2015); Bergen Assembly, Norway (2016); ZKM, Karlsruhe, Germany (2016); Galerie Chantal Crousel, Paris (2017); Garage Museum of Contemporary Art, Moscow (2018); and CentroCentro, Madrid (2019).
          - paragraph [ref=e272]: Throughout this journey, Tarek Atoui conceived an ensemble of 11 musical instruments that address both deaf and hearing people, and these instruments have been played by hundreds of professionals and amateurs, both deaf and hearing. Today, the project is expanding notions of listening beyond the aural, and its principles rely on modes of tactile, physical, visual and gestural sound perception.
