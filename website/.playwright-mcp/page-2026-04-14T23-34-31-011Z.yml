      - generic [ref=e300]:
        - heading "The Reverse Collection" [level=2] [ref=e301]
        - paragraph [ref=e302]: 2016–2021
        - generic [ref=e303]:
          - paragraph [ref=e304]: Between October 2013 and May 2014, Tarek Atoui invited 18 experimental musicians from around the world to select and improvise on the instrument collection of the Dahlem Ethnological Museum in Berlin. Devoid of any historical or anthropological information, they engaged with the instruments intuitively, using unconventional techniques and objects to produce sounds. On 30 May and 1 June 2014, Atoui presented a series of 12 live performances at the Dahlem Museum. Composed and directed by the artist, Dahlem Sessions was performed in front of a small audience and meticulously recorded.
          - paragraph [ref=e305]: Tarek Atoui took audio excerpts recorded in the Dahlem Sessions as a starting point for The Reverse Collection and collaborating with instrument makers on imagining and building the objects that could have generated these recordings. Without involving any images, Atoui proposed to engage with sound directly — contrary to the usual path of ethnomusicology, which studies the shape and mechanism of an instrument with an emphasis on its cultural and social context.
