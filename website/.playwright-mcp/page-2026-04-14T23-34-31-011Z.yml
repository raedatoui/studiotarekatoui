        - heading "The Rain" [level=2] [ref=e77]
        - paragraph [ref=e78]: "2023"
        - generic [ref=e79]:
          - paragraph [ref=e80]: The Rain offers a unique fusion of Korean traditional percussion instruments and electronic soundscapes, introducing visitors to an entirely novel way of experiencing sound.
          - paragraph [ref=e81]: Atoui's journey began in 2019 when he embarked on a research expedition to South Korea. During this exploration, he developed a profound fascination with Korean traditional culture, extending his interest beyond traditional instruments to include ceramics, porcelain, hanji (traditional Korean paper), weaving, and more. Through collaborations with artisans, craftsmen, and scholars of traditional culture, he has created instruments and forms that reflect his distinctive artistic style.
