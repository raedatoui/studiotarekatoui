        - heading "The Ground" [level=2] [ref=e243]
        - paragraph [ref=e244]: "2018"
        - generic [ref=e245]:
          - paragraph [ref=e246]: Combining visual, tactile and aural modes of perceiving sound, this composition is the result of five years of travel Atoui undertook in the Pearl River Delta in southern China, where he observed local practices of farming and the architectural environment. During this time, Atoui recorded his observations of contemporary and traditional agricultural, architectural and musical practices from the region in a booklet that he shared with craftsmen and instrument makers, who then interpreted the information in their work.
          - paragraph [ref=e247]: The resulting instruments were set up by Atoui to play separately and autonomously at exhibitions, first in Guangzhou and later in Singapore, where various artists and musicians were invited to respond to both the forms and sounds of the work. At the Venice Biennale (2019), the piece was presented as a completed composition and listening space based on the project’s previous iterations.
