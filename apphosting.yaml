runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 20
  cpu: 1
  memoryMiB: 1024

env:
  - variable: AUTH_URL
    value: https://cms--studio-tarekatoui-cms.us-east4.hosted.app
  - variable: AUTH_TRUST_HOST
    value: 'true'
  - variable: DATABASE_URL
    secret: cms-firestore-database-url@1
    availability:
      - RUNTIME
  - variable: PAYLOAD_SECRET
    secret: cms-payload-secret@1
  - variable: AUTH_SECRET
    secret: cms-auth-secret@1
    availability:
      - RUNTIME
  - variable: AUTH_GOOGLE_ID
    secret: cms-google-client-id@1
    availability:
      - RUNTIME
  - variable: AUTH_GOOGLE_SECRET
    secret: cms-google-client-secret@1
    availability:
      - RUNTIME
  - variable: CMS_ALLOWED_EMAILS
    secret: cms-allowed-emails@1
    availability:
      - RUNTIME
