packages:
  - cms
  - website
  - packages/*

catalog:
  # Keep cms/package.json's explicit Next version aligned; App Hosting cannot parse catalog:.
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  firebase: 13.0.0
  typescript: 7.0.2
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@biomejs/biome': 2.5.15
  zod: 4.6.7
  payload: 3.91.0
  '@payloadcms/db-mongodb': 3.91.0
  '@payloadcms/next': 3.91.0
  '@payloadcms/ui': 3.91.0
  '@next/env': 16.4.2

allowBuilds:
  '@firebase/util': true
  protobufjs: true
  re2: true
  sharp: true
  esbuild: true
  unrs-resolver: true
